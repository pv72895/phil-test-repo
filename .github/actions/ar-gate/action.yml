name: ar-gate
description: >-
  Auto re-run E2E harness. Reads the first ar/active/*.json in the tip commit's first-parent diff
  (git diff HEAD^1 HEAD); needs a checkout with fetch-depth 2 first.
outputs:
  active: { description: "true when a control file was added", value: "${{ steps.g.outputs.active }}" }
  json: { description: "the control file as compact JSON ({} when inactive)", value: "${{ steps.g.outputs.json }}" }
runs:
  using: composite
  steps:
    - id: g
      shell: bash
      run: |
        f=$(git diff --name-only HEAD^1 HEAD -- ar/active/ | head -1)
        echo "gate: tip $(git rev-parse HEAD) first parent $(git rev-parse HEAD^1) file ${f:-<none>}"
        if [ -n "$f" ] && [ -f "$f" ]; then j=$(jq -c . "$f"); a=true; else j='{}'; a=false; fi
        echo "gate: active=$a json=$j"
        { echo "active=$a"; echo "json=$j"; } >> "$GITHUB_OUTPUT"
