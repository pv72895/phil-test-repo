name: e2e-gate
description: >-
  Reads this run's control file: the e2e/active/*.json files in the tip commit's first-parent diff
  (git diff HEAD^1 HEAD), so a predecessor PR's control file stays inert. Needs a checkout with
  fetch-depth 2 first. A file with a "pr" field applies only to the test branch trunk-merge/pr-<pr>/*.
inputs:
  shape:
    description: the shape key to read from the control file
    required: true
outputs:
  active:
    description: "true when the control file names this shape"
    value: ${{ steps.g.outputs.active }}
  params:
    description: the shape's parameters as compact JSON ({} when inactive)
    value: ${{ steps.g.outputs.params }}
runs:
  using: composite
  steps:
    - id: g
      shell: bash
      env:
        SHAPE: ${{ inputs.shape }}
        REF: ${{ github.ref_name }}
      run: |
        files=$(git diff --name-only HEAD^1 HEAD -- e2e/active/)
        echo "gate: ref ${REF} tip $(git rev-parse HEAD) first parent $(git rev-parse HEAD^1)"
        echo "gate: control files in the tip's first-parent diff: ${files:-<none>}"
        pr=$(sed -nE 's#^trunk-merge/pr-([0-9]+)/.*#\1#p' <<<"${REF}")
        params=null
        for f in ${files}; do
          case "${f}" in *.json) ;; *) continue ;; esac
          [ -f "${f}" ] || continue
          fpr=$(jq -r '.pr // empty' "${f}")
          if [ -n "${fpr}" ] && [ "${fpr}" != "${pr}" ]; then
            echo "gate: ignoring ${f}: its pr ${fpr} is not this branch's ${pr}"
            continue
          fi
          p=$(jq -c --arg s "${SHAPE}" '.[$s] // null' "${f}") || { echo "gate: ${f} is not valid JSON"; exit 1; }
          if [ "${p}" != null ]; then params=${p}; fi
        done
        if [ "${params}" = null ]; then active=false; params='{}'; else active=true; fi
        echo "gate: shape ${SHAPE} active=${active} params=${params}"
        { echo "active=${active}"; echo "params=${params}"; } >> "${GITHUB_OUTPUT}"
