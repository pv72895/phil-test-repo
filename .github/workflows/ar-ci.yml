# Auto re-run E2E harness (plan-auto-rerun-e2e-test.md §1.5). Inactive unless the run adds ar/active/*.json.
name: AR CI
on:
  push: { branches: ['trunk-merge/**'] }
  workflow_dispatch: { inputs: { hog_min: { default: '0' }, group: { default: '' } } }
concurrency: { group: "${{ inputs.group || format('ar-ci-{0}', github.ref_name) }}", cancel-in-progress: false }
permissions: { contents: read, actions: write, checks: write, statuses: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { active: "${{ steps.g.outputs.active }}", json: "${{ steps.g.outputs.json }}" }
    steps:
      - run: "h='${{ inputs.hog_min }}'; if [ -n \"$h\" ] && [ \"$h\" != 0 ]; then echo hog $h min; sleep $((h*60)); fi"
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - { id: g, uses: ./.github/actions/ar-gate }
  ar-required:
    needs: gate
    if: ${{ inputs.hog_min == '' || inputs.hog_min == '0' || inputs.hog_min == null }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          d=0; [ "$ACTIVE" = true ] && d=45
          fail_if required_fail_attempts required_sleep_s $d
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-flaky:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          c=$(jq -r '.cancel_after_s // empty' <<<"$J")
          if [ -n "$c" ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then sleep "$c"; echo "cancelling run $GITHUB_RUN_ID"; gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel; sleep 120; fi
          if [ "$(jq -r '.always_fail // false' <<<"$J")" = true ]; then echo always_fail; exit 1; fi
          fail_if fail_attempts flaky_sleep_s
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-slow:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: s=$(jq -r '.slow_s // 0' <<<"$J"); echo "sleep $s"; sleep "$s"
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-chain-a:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          fail_if chain_fail_attempts chain_sleep_s
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-chain-b:
    needs: [gate, ar-chain-a]
    runs-on: ubuntu-latest
    steps: [ { run: "echo b" } ]
  ar-matrix:
    needs: gate
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { leg: [1, 2, 3] } }
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          if [ "${{ matrix.leg }}" = 2 ]; then fail_if matrix_fail_attempts matrix_sleep_s; fi
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-rollup:
    needs: [gate, ar-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps: [ { run: "echo matrix=${{ needs.ar-matrix.result }}; [ '${{ needs.ar-matrix.result }}' = success ]" } ]
  ar-skipped:
    needs: gate
    if: ${{ fromJSON(needs.gate.outputs.json).skip_named != true }}
    runs-on: ubuntu-latest
    steps: [ { run: "echo ran" } ]
