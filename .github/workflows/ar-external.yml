# Auto re-run E2E harness: a required status Trunk cannot re-run (target_url is not an Actions run).
name: AR External
on: { push: { branches: ['trunk-merge/**'] } }
permissions: { contents: read, statuses: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { active: "${{ steps.g.outputs.active }}", json: "${{ steps.g.outputs.json }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - { id: g, uses: ./.github/actions/ar-gate }
  post:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: |
          state=success; [ "$(jq -r '.external_fail // false' <<<"$J")" = true ] && state=failure
          for i in 1 2 3 4 5; do gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=$state -f context=ar/external \
            -f target_url=https://buildkite.com/pv72895/ar/builds/1 --jq .id && break; sleep 3; done
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
