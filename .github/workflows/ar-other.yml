# Auto re-run E2E harness: a second workflow unit.
name: AR Other
on: { push: { branches: ['trunk-merge/**'] } }
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { active: "${{ steps.g.outputs.active }}", json: "${{ steps.g.outputs.json }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - { id: g, uses: ./.github/actions/ar-gate }
  ar-other-required:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          fail_if other_required_fail_attempts other_required_sleep_s
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-other-flaky:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          fail_if other_fail_attempts other_sleep_s
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
