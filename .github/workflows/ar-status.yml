# Auto re-run E2E harness: a required commit status (ar/status) whose job is a check run on the same run.
name: AR Status
on: { push: { branches: ['trunk-merge/**'] } }
permissions: { contents: read, statuses: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { active: "${{ steps.g.outputs.active }}", json: "${{ steps.g.outputs.json }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - { id: g, uses: ./.github/actions/ar-gate }
  ar-st-build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: |
          fail_if() { s=$(jq -r --arg a "$GITHUB_RUN_ATTEMPT" --argjson d "${3:-0}" ".$2[\$a] // \$d" <<<"$J"); echo "attempt $GITHUB_RUN_ATTEMPT: sleep ${s}s"; sleep "$s"; if jq -e --argjson a "$GITHUB_RUN_ATTEMPT" "(.$1 // []) | any(.[]; . == \$a)" <<<"$J" >/dev/null; then echo "fail on attempt $GITHUB_RUN_ATTEMPT"; exit 1; fi; echo "pass on attempt $GITHUB_RUN_ATTEMPT"; }
          fail_if status_fail_attempts status_sleep_s
        env: { J: "${{ needs.gate.outputs.json }}", ACTIVE: "${{ needs.gate.outputs.active }}", GH_TOKEN: "${{ github.token }}" }
  ar-st-report:
    needs: [gate, ar-st-build]
    if: always()
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - run: |
          state=failure; [ '${{ needs.ar-st-build.result }}' = success ] && state=success
          for i in 1 2 3 4 5; do gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=$state -f context=ar/status \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .id && break; sleep 3; done
