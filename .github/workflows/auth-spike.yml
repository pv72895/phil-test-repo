name: auth-spike

on:
  pull_request:
  push:
    branches: [main, spike-same-repo]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Run context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          echo "event_name=$EVENT_NAME"
          echo "github.repository=$REPOSITORY (id $REPOSITORY_ID)"
          jq '{
            head_repo: .pull_request.head.repo.full_name,
            head_repo_id: .pull_request.head.repo.id,
            head_is_fork: .pull_request.head.repo.fork,
            base_repo: .pull_request.base.repo.full_name,
            base_repo_id: .pull_request.base.repo.id
          }' "$GITHUB_EVENT_PATH"

      - name: GITHUB_TOKEN introspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "--- GET /installation/repositories"
          curl -sS -D headers.txt -o body.json -w 'status=%{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/repositories
          grep -iE '^(x-oauth-scopes|x-accepted-github-permissions|x-ratelimit-limit|x-ratelimit-resource|github-authentication-token-expiration):' headers.txt || true
          jq '{total_count, repositories: [.repositories[]? | {full_name, id, fork}], message}' body.json
          echo "--- GET /repos/$GITHUB_REPOSITORY (control)"
          curl -sS -o /dev/null -w 'status=%{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"

      - name: OIDC availability and claims
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: NOT AVAILABLE (ACTIONS_ID_TOKEN_REQUEST_URL unset)"
            exit 0
          fi
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=trunk-auth-spike" | jq -r .value)
          echo "::add-mask::$token"
          echo "OIDC: available"
          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keep = ["iss", "aud", "sub", "repository", "repository_id", "repository_owner",
                  "repository_owner_id", "event_name", "ref", "job_workflow_ref",
                  "workflow_ref", "head_ref", "base_ref", "iat", "exp"]
          print(json.dumps({k: claims.get(k) for k in keep}, indent=2))
          print("lifetime_seconds:", claims["exp"] - claims["iat"])
          PY
