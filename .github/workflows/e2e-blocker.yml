# E2E harness (staging re-run test plan §3.3). Inactive unless this run's control file names "blocker".
name: E2E Blocker
on:
  push:
    branches: ["trunk-merge/**"]
permissions: {contents: read, statuses: write, checks: write, actions: write, pull-requests: read}
jobs:
  e2e-blocker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        uses: ./.github/actions/e2e-gate
        with: {shape: blocker}
      - env:
          ACTIVE: ${{ steps.gate.outputs.active }}
          P: ${{ steps.gate.outputs.params }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          [ "${ACTIVE}" = true ] || { echo "inactive: pass"; exit 0; }
          n=$(sed -nE 's#^trunk-merge/pr-([0-9]+)/.*#\1#p' <<<"${REF}")
          max=$(jq -r '.max_min // 55' <<<"${P}")
          end=$(( $(date +%s) + max * 60 ))
          echo "waiting up to ${max} min for refs/heads/e2e-release/pr-${n}[-fail]"
          while [ "$(date +%s)" -lt "${end}" ]; do
            for r in $(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/e2e-release/pr-${n}" --jq '.[].ref'); do
              case "${r}" in
                "refs/heads/e2e-release/pr-${n}") echo "released by ${r} at $(date -u +%FT%TZ)"; exit 0 ;;
                "refs/heads/e2e-release/pr-${n}-fail") echo "released to fail by ${r} at $(date -u +%FT%TZ)"; exit 1 ;;
              esac
            done
            sleep 60
          done
          echo "max_min ${max} passed without a release: pass"
