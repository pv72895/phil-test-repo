# E2E harness (staging re-run test plan §3.3): posts E2E G Build's outcome as e2e/g-own (this run)
# and e2e/g-trigger (the build run) on the build's head SHA. Runs on main, so it never gates: it reads
# the control file from the build's head commit through the API.
name: E2E G Reporter
on:
  workflow_run:
    workflows: [E2E G Build]
    types: [completed]
permissions: {contents: read, statuses: write, checks: write, actions: write, pull-requests: read}
jobs:
  e2e-g-report:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          STATE: ${{ github.event.workflow_run.conclusion == 'success' && 'success' || 'failure' }}
          OWN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event.workflow_run.html_url }}
          DESC: reporter ${{ github.run_id }}/${{ github.run_attempt }} for build ${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }}
        run: |
          pr=$(sed -nE 's#^trunk-merge/pr-([0-9]+)/.*#\1#p' <<<"${BRANCH}")
          p1=$(gh api "repos/${R}/commits/${SHA}" --jq '.parents[0].sha')
          files=$(gh api "repos/${R}/compare/${p1}...${SHA}" --jq '.files[]? | select(.status != "removed") | .filename | select(startswith("e2e/active/"))')
          echo "build ${SHA} (${BRANCH}), first parent ${p1}; control files: ${files:-<none>}"
          params=null
          for f in ${files}; do
            c=$(gh api "repos/${R}/contents/${f}?ref=${SHA}" --jq .content | base64 -d) || continue
            fpr=$(jq -r '.pr // empty' <<<"${c}")
            if [ -n "${fpr}" ] && [ "${fpr}" != "${pr}" ]; then echo "ignoring ${f}: pr ${fpr} != ${pr}"; continue; fi
            p=$(jq -c '.g_build // null' <<<"${c}")
            if [ "${p}" != null ]; then params=${p}; fi
          done
          delay=5
          if [ "${params}" != null ]; then delay=$(jq -r '.report_delay_s // 5' <<<"${params}"); fi
          echo "g_build params ${params}; sleeping ${delay}s"; sleep "${delay}"
          gh api -X POST "repos/${R}/statuses/${SHA}" -f state="${STATE}" -f context=e2e/g-own -f target_url="${OWN}" -f description="${DESC}" --jq '{id, state, context, target_url, created_at}'
          gh api -X POST "repos/${R}/statuses/${SHA}" -f state="${STATE}" -f context=e2e/g-trigger -f target_url="${TRIGGER}" -f description="${DESC}" --jq '{id, state, context, target_url, created_at}'
