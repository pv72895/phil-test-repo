# E2E harness (staging re-run test plan §3.3). Inactive unless this run's control file names "oddstatus".
name: E2E Odd Status
on:
  push:
    branches: ["trunk-merge/**"]
permissions: {contents: read, statuses: write, checks: write, actions: write, pull-requests: read}
jobs:
  e2e-oddstatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        uses: ./.github/actions/e2e-gate
        with: {shape: oddstatus}
      - env:
          GH_TOKEN: ${{ github.token }}
          OWN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTIVE: ${{ steps.gate.outputs.active }}
          P: ${{ steps.gate.outputs.params }}
        run: |
          ghr() { local i; for i in 1 2 3 4 5; do gh "$@" && return 0; echo "gh $1 failed (try ${i}), retrying" >&2; sleep $((i * 5)); done; return 1; }
          R=${GITHUB_REPOSITORY}
          bad() { [ "${ACTIVE}" = true ] && jq -e --arg k "$1" '(.fail // []) | any(.[]; . == $k)' <<<"${P}" >/dev/null; }
          post() {  # context state [target_url]
            ghr api -X POST "repos/${R}/statuses/${GITHUB_SHA}" -f state="$2" -f context="$1" ${3:+-f target_url="$3"} \
              -f description="attempt ${GITHUB_RUN_ATTEMPT}" --jq '{id, state, context, target_url, created_at}'
          }
          one() {  # key context failing_url
            if bad "$1"; then post "$2" failure "$3"; else post "$2" success "${OWN}"; fi
          }
          one cross_repo e2e/cross-repo https://github.com/pv72895/e2e-elsewhere/actions/runs/1
          one cross_job e2e/cross-job https://github.com/pv72895/e2e-elsewhere/actions/runs/1/job/1
          one no_url e2e/no-url ""
          one external e2e/external https://buildkite.com/pv72895/e2e/builds/1
          if bad ext_check; then c=failure; else c=success; fi
          ghr api -X POST "repos/${R}/check-runs" -f name=e2e-ext-check -f head_sha="${GITHUB_SHA}" -f status=completed \
            -f conclusion="${c}" -f details_url=https://buildkite.com/pv72895/e2e/builds/1 \
            --jq '{id, name, status, conclusion, details_url, html_url, app: .app.slug}'
          if bad late; then
            post e2e/late pending ""
            s=$(jq -r '.late_s // 60' <<<"${P}"); echo "late: sleeping ${s}s"; sleep "${s}"
            post e2e/late failure ""
          else
            post e2e/late success "${OWN}"
          fi
