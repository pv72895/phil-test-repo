# E2E harness (staging re-run test plan §3.3). Inactive unless this run's control file names "single".
name: E2E Single
on:
  push:
    branches: ["trunk-merge/**"]
permissions: {contents: read, statuses: write, checks: write, actions: write, pull-requests: read}
jobs:
  gate:
    name: e2e-single-gate
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.gate.outputs.active }}
      params: ${{ steps.gate.outputs.params }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        uses: ./.github/actions/e2e-gate
        with: {shape: single}
  e2e-single:
    needs: gate
    runs-on: ${{ fromJSON(needs.gate.outputs.params).runs_on_attempt[format('{0}', github.run_attempt)] || 'ubuntu-latest' }}
    steps:
      - env:
          ACTIVE: ${{ needs.gate.outputs.active }}
          P: ${{ needs.gate.outputs.params }}
        run: |
          [ "${ACTIVE}" = true ] || { echo "inactive: pass"; exit 0; }
          fails() { jq -e --argjson a "${GITHUB_RUN_ATTEMPT}" "(.${1:-fail_attempts} // ${2:-[1]}) | any(.[]; . == \$a)" <<<"${P}" >/dev/null; }
          s=$(jq -r --arg a "${GITHUB_RUN_ATTEMPT}" '.fail_sleep_s[$a] // 0' <<<"${P}")
          echo "attempt ${GITHUB_RUN_ATTEMPT}: sleeping ${s}s"; sleep "${s}"
          if fails fail_attempts; then echo "failing attempt ${GITHUB_RUN_ATTEMPT}"; exit 1; fi
          echo "passing attempt ${GITHUB_RUN_ATTEMPT}"
  e2e-single-b:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - env:
          ACTIVE: ${{ needs.gate.outputs.active }}
          P: ${{ needs.gate.outputs.params }}
        run: |
          [ "${ACTIVE}" = true ] || { echo "inactive: pass"; exit 0; }
          fails() { jq -e --argjson a "${GITHUB_RUN_ATTEMPT}" "(.${1:-fail_attempts} // ${2:-[1]}) | any(.[]; . == \$a)" <<<"${P}" >/dev/null; }
          if fails fail_attempts_b '[]'; then echo "failing attempt ${GITHUB_RUN_ATTEMPT}"; exit 1; fi
          echo "passing attempt ${GITHUB_RUN_ATTEMPT}"
  e2e-single-sibling:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - env:
          ACTIVE: ${{ needs.gate.outputs.active }}
          P: ${{ needs.gate.outputs.params }}
        run: |
          [ "${ACTIVE}" = true ] || { echo "inactive: pass"; exit 0; }
          s=$(jq -r '.sibling_sleep_s // 0' <<<"${P}")
          echo "sibling sleeping ${s}s"; sleep "${s}"
