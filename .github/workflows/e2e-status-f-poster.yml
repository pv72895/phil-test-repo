# E2E harness (staging re-run test plan §3.3): status shape F, run on main; posts on another commit.
# Never gates: its behaviour comes from its input.
name: E2E Status F Poster
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
permissions: {contents: read, statuses: write, checks: write, actions: write, pull-requests: read}
env:
  CTX: e2e/status-f
  TARGET: ${{ inputs.target_sha }}
  GH_TOKEN: ${{ github.token }}
jobs:
  inprogress:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api -X POST repos/${{ github.repository }}/statuses/$TARGET -f state=pending -f context=$CTX -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -f description="attempt ${{ github.run_attempt }} job ${{ github.job }} event ${{ github.event_name }}" --jq "{id, state, context, target_url, created_at}"
  build:
    needs: inprogress
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 10; echo attempt ${{ github.run_attempt }} sha ${{ github.sha }}; [ "${{ github.run_attempt }}" != "1" ]
  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15; STATE=${{ needs.build.result == 'success' && 'success' || 'failure' }}; gh api -X POST repos/${{ github.repository }}/statuses/$TARGET -f state=$STATE -f context=$CTX -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -f description="attempt ${{ github.run_attempt }} job ${{ github.job }} event ${{ github.event_name }}" --jq "{id, state, context, target_url, created_at}"
