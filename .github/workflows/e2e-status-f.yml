# E2E harness (staging re-run test plan §3.3). Inactive unless this run's control file names "status_f".
name: E2E Status F
on:
  push:
    branches: ["trunk-merge/**"]
permissions: {contents: read, statuses: write, checks: write, actions: write, pull-requests: read}
jobs:
  e2e-status-f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        uses: ./.github/actions/e2e-gate
        with: {shape: status_f}
      - env:
          GH_TOKEN: ${{ github.token }}
          OWN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          ACTIVE: ${{ steps.gate.outputs.active }}
          CTX: e2e/status-f
          STATE: success
        run: |
          if [ "${ACTIVE}" = true ]; then
            gh workflow run e2e-status-f-poster.yml --ref main -f target_sha="${GITHUB_SHA}"
            echo "dispatched e2e-status-f-poster.yml for ${GITHUB_SHA}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="${STATE}" -f context="${CTX}" -f target_url="${OWN}" -f description="attempt ${GITHUB_RUN_ATTEMPT} job ${GITHUB_JOB}" --jq "{id, state, context, target_url, created_at, updated_at}"
          fi
