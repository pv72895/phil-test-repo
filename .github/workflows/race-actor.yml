name: Race Actor
on:
  push:
    branches: ['trunk-merge/**']
permissions:
  contents: read
  pull-requests: read
jobs:
  required:
    name: Important Tests 1
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          N=$(echo "$REF" | sed -nE 's#^trunk-merge/pr-([0-9]+)/.*#\1#p')
          HEAD=$(gh api "repos/$R/pulls/$N" --jq .head.ref)
          echo "pr=$N head=$HEAD attempt=$ATTEMPT"
          case "$HEAD" in
            race-blocker*)
              for i in $(seq 1 1700); do
                gh api "repos/$R/git/ref/heads/race-release/pr-$N" >/dev/null 2>&1 && { echo released; exit 0; }
                sleep 10
              done; exit 0 ;;
            race-target*) [ "$ATTEMPT" = 1 ] && { echo "fail on attempt 1"; exit 1; }; exit 0 ;;
          esac
  other:
    name: race-other
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          N=$(echo "$REF" | sed -nE 's#^trunk-merge/pr-([0-9]+)/.*#\1#p')
          HEAD=$(gh api "repos/$R/pulls/$N" --jq .head.ref)
          echo "pr=$N head=$HEAD attempt=$ATTEMPT"
          case "$HEAD" in race-target*) [ "$ATTEMPT" = 1 ] && { echo "fail on attempt 1"; exit 1; } ;; esac
          exit 0
  pass:
    name: race-pass
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
