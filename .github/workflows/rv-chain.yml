name: RV Chain
on:
  workflow_run:
    workflows: ["RV Fail"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chained:
    runs-on: ubuntu-latest
    steps:
      - run: echo "attempt $GITHUB_RUN_ATTEMPT event $GITHUB_EVENT_NAME"; if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then exit 1; fi
