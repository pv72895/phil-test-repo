name: stackval-approve
on:
  pull_request:
    types: [labeled]
permissions:
  pull-requests: write
jobs:
  approve:
    if: github.event.label.name == 'approve-me'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "$PR" --approve --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
