name: Trunk GitHub Actions auth (staging)

on: pull_request

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: trunk-io/login@main
        with:
          api-url: https://api.trunk-staging.io/v2

      - run: trunk --version

      - run: trunk auth status

      - name: Upload impacted targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '//spike:a\n//spike:b\n' > targets.txt
          trunk mergequeue upload-impacted-targets --targets-file targets.txt --json

      # The minted JWT must reach nothing but its own upload. It is masked before any use.
      - name: Containment probes
        env:
          TRUNK_API_URL: https://api.trunk-staging.io/v2
        run: |
          creds="${XDG_CONFIG_HOME:-$HOME/.config}/trunk-cli/credentials.json"
          jwt=$(jq -r .githubActions.jwt "$creds")
          echo "::add-mask::$jwt"
          repo_id=$(jq -r .githubActions.repository.id "$creds")
          probe() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -X "$1" -H "x-trunk-token: $jwt" "$TRUNK_API_URL$2")
            echo "$1 $2 -> $code (want $3)"
            [ "$code" = "$3" ]
          }
          fail=0
          probe GET "/cloud/workspaces" 403 || fail=1
          probe GET "/repositories/$repo_id" 403 || fail=1
          probe GET "/merge-queues" 403 || fail=1
          exit $fail
