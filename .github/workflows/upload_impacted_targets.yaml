name: Upload Impacted Targets
run-name: Upload Impacted Targets for ${{ github.ref_name }}
on: pull_request

# id-token: write mints the OIDC token the v2 upload logs in with (no Trunk secret).
permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  compute_impacted_targets:
    name: Compute Impacted Targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compute Impacted Targets
        uses: trunk-io/merge-action@main
        with:
          auth: github-actions
          trunk-api-url: https://api.trunk-staging.io/v2
          bazel-workspace-path: workspace
          verbose: 1
